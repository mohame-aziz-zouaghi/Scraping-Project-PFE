# SCRAPINGPROJECT/redis.conf

# Enable RDB persistence (snapshots)
save 60 1000    # Save after 60 seconds if at least 1000 keys changed
save 300 100    # Save after 300 seconds if at least 100 keys changed
save 3600 1     # Save after 1 hour if at least 1 key changed

# RDB filename
dbfilename dump.rdb

# RDB directory (inside container - will map to your host volume)
dir /data

# Enable AOF persistence (append-only file - more durable)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 2gb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Disable protected mode for local development
protected-mode no

# Bind to all interfaces (for Docker)
bind 0.0.0.0

# Port
port 6379

# Require password (optional - uncomment if needed)
# requirepass yourpassword

# Snapshot compression
rdbcompression yes

# Checksum
rdbchecksum yes

# Stop writing if disk is full
stop-writes-on-bgsave-error yes